name: Component proposal
description: Propose a new component, or a new variant of an existing one. Designers and engineers use the same form.
title: "[Component] "
labels: ["proposal", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing something. A product designer and a design-system maintainer review proposals within 3 business days.
        You don't need to write code. If it's only needed in one place, build it in the product first; we promote it once a second team needs it.
  - type: input
    id: name
    attributes:
      label: Component name
      description: PascalCase, named for what it is, not how it looks.
      placeholder: ShariaBadge
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What problem does it solve?
      description: When should someone use it, and when should they not?
    validations:
      required: true
  - type: textarea
    id: surfaces
    attributes:
      label: Where is it needed?
      description: List the product surfaces or squads. Two or more makes it a design-system component.
      placeholder: |
        - Onboarding (KYC result screen)
        - Investments (fund detail)
    validations:
      required: true
  - type: textarea
    id: variants
    attributes:
      label: Variants and states
      description: Name variants by intent (danger, pending), not appearance (red, grey). Include loading, disabled, error and empty states if they apply.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Content and accessibility
      description: Copy rules, what a screen reader should announce, keyboard behaviour, anything that changes in Arabic (RTL).
  - type: input
    id: figma
    attributes:
      label: Figma link
      placeholder: https://www.figma.com/design/…
  - type: dropdown
    id: group
    attributes:
      label: Does it know about banking?
      description: Banking components (money, accounts, Islamic finance) go in banking/; generic controls go in core/.
      options:
        - "No, it's a generic control (core)"
        - "Yes, it knows about money, accounts or Islamic finance (banking)"
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: Review
      options:
        - label: This includes Islamic-finance wording or calculations, so it needs Sharia-board review.
