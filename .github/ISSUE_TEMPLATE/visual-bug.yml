name: Visual or accessibility bug
description: Something looks wrong, reads wrong, or doesn't work with a keyboard or screen reader.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: TransactionCard
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: What you expected and what you saw. A screenshot or a playground link is ideal.
    validations:
      required: true
  - type: checkboxes
    id: where
    attributes:
      label: Where does it happen?
      options:
        - label: Web
        - label: iOS
        - label: Android
        - label: Light theme
        - label: Dark theme
        - label: Arabic / right-to-left
        - label: Keyboard or screen reader
