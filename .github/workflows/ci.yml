name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tokens in sync, types (web + native), lint, unit + a11y tests
        run: npm run verify
      - name: Build Storybook (web playground)
        run: npm run build
      - name: Build web library
        run: npm run build:lib
      - name: Bundle the React Native app (proves Metro resolves the native entry)
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/expo-export
