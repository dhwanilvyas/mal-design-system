name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tokens in sync, types, lint, unit + a11y tests
        run: npm run verify
      - name: Build Storybook
        run: npm run build
      - name: Build library
        run: npm run build:lib
